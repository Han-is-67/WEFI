<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Section</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .image-section {
        padding: 60px 0;
      }

      .section-title {
        text-align: center;
        margin-bottom: 30px;
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .image-box {
        background: #cbd5e1;
        height: 220px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <section class="image-section">
      <div class="container">
        <h2 class="section-title">Gallery</h2>

        <div class="image-grid">
          <div class="image-box"></div>
          <div class="image-box"></div>
          <div class="image-box"></div>
        </div>
      </div>
    </section>
  </body>
</html>

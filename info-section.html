<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Info Section</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .info-section {
        padding: 60px 0;
      }

      .section-title {
        text-align: center;
        margin-bottom: 30px;
      }

      .cards {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .card {
        flex: 1 1 250px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <section class="info-section">
      <div class="container">
        <h2 class="section-title">Our Features</h2>

        <div class="cards">
          <div class="card">
            <h3>Fast</h3>
            <p>Quick and efficient service for every project.</p>
          </div>

          <div class="card">
            <h3>Reliable</h3>
            <p>We build trust through quality and consistency.</p>
          </div>

          <div class="card">
            <h3>Modern</h3>
            <p>Clean design and simple user experience.</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>

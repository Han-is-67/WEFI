<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTA and Footer</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .cta-section {
        padding: 60px 0;
      }

      .cta-box {
        background: #111827;
        color: white;
        text-align: center;
        padding: 50px 20px;
        border-radius: 12px;
      }

      .btn {
        display: inline-block;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
        margin-top: 10px;
      }

      .footer {
        background: #111827;
        color: white;
        text-align: center;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <section class="cta-section">
      <div class="container">
        <div class="cta-box">
          <h2>Ready to build something amazing?</h2>
          <p>Contact us today and let's get started.</p>
          <a href="#" class="btn">Contact Us</a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">© 2026 MyBrand. All rights reserved.</div>
    </footer>
  </body>
</html>

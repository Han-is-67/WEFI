<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .hero {
        background: linear-gradient(135deg, #dbeafe, #e0f2fe);
        padding: 80px 0;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .hero-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 30px;
      }

      .hero-text {
        flex: 1;
      }

      .hero-text h1 {
        font-size: 2.5rem;
        margin-bottom: 15px;
      }

      .hero-text p {
        margin-bottom: 20px;
      }

      .btn {
        display: inline-block;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
      }

      .hero-image {
        flex: 1;
        background: #bfdbfe;
        height: 280px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="container hero-content">
        <div class="hero-text">
          <h1>Welcome to our website</h1>
          <p>This is a simple hero section with text and a call-to-action button.</p>
          <a href="#" class="btn">Get Started</a>
        </div>

        <div class="hero-image"></div>
      </div>
    </header>
  </body>
</html>
